<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de D&D - Jugador</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .exp-bar { transition: width 1s ease-in-out; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .class-container {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.4rem;
    }
    .class-badge {
      padding: 0.15rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: #312e81;
      color: #c7d2fe;
    }
    .subclass-badge {
      padding: 0.15rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: #064e3b;
      color: #a7f3d0;
    }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <!-- ================= HEADER ================= -->
  <header class="sticky top-0 z-40 bg-zinc-900/80 backdrop-blur border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <h1 class="text-3xl font-bold tracking-wide text-red-400 text-center">
        🐉 Tablero de D&D
      </h1>
    </div>
  </header>

  <!-- ================= CONTENIDO ================= -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    <section class="mb-8 bg-zinc-900 border border-zinc-700 rounded-2xl p-4 shadow-lg">
      <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
        <input id="searchInput" type="text" placeholder="Buscar por nombre" class="w-full md:w-64 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-red-500" />
        <select id="filterLevel" class="w-full md:w-40 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="">Todos los niveles</option>
          <option value="1-3">Nivel 1–3</option>
          <option value="4-6">Nivel 4–6</option>
          <option value="7-9">Nivel 7–9</option>
          <option value="10+">Nivel 10+</option>
        </select>
        <select id="sortAlphabet" class="w-full md:w-40 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="">Ordenar</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
        <select id="filterClass" class="w-full md:w-40 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="">Todas las clases</option>
        </select>
        <select id="filterSubclass" class="w-full md:w-40 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100 focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="">Todas las subclases</option>
        </select>
      </div>
    </section>

    <section id="playerBoard" class="relative min-h-screen"></section>
  </main>

  <!-- ================= MODAL OBJETO ================= -->
  <div id="objectModal" onclick="closeObjectModal()" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[9999]">
    <div onclick="event.stopPropagation()" class="bg-stone-800 border border-stone-600 rounded-xl p-6 max-w-sm w-full relative shadow-2xl">
      <button onclick="closeObjectModal()" class="absolute top-2 right-2 text-stone-300 hover:text-white text-xl">✕</button>
      <img id="objectModalImg" class="w-full h-48 object-cover rounded mb-4 border border-stone-700" />
      <p id="objectModalDesc" class="text-stone-200 text-sm whitespace-pre-line"></p>
    </div>
  </div>

  <!-- ================= TOASTS ================= -->
  <div id="toastContainer" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <!-- ================= CALCULADORA ================= -->
  <button onclick="openCalc()" class="fixed bottom-6 left-6 z-[900] bg-red-500 hover:bg-yellow-600 text-white px-4 py-3 rounded-full shadow-xl text-xl">🧮</button>

  <div id="calcModal" onclick="closeCalc()" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[800]">
    <div onclick="event.stopPropagation()" class="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 w-80 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-red-400">🧮 Calculadora</h2>
        <button onclick="closeCalc()" class="text-zinc-400 hover:text-white text-xl">✕</button>
      </div>
      <input id="calcDisplay" readonly class="w-full mb-4 px-3 py-2 text-right text-xl rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-100" />
      <div class="grid grid-cols-4 gap-3">
        <button onclick="calcInput('7')" class="calc-btn">7</button>
        <button onclick="calcInput('8')" class="calc-btn">8</button>
        <button onclick="calcInput('9')" class="calc-btn">9</button>
        <button onclick="calcInput('/')" class="calc-op">÷</button>
        <button onclick="calcInput('4')" class="calc-btn">4</button>
        <button onclick="calcInput('5')" class="calc-btn">5</button>
        <button onclick="calcInput('6')" class="calc-btn">6</button>
        <button onclick="calcInput('*')" class="calc-op">×</button>
        <button onclick="calcInput('1')" class="calc-btn">1</button>
        <button onclick="calcInput('2')" class="calc-btn">2</button>
        <button onclick="calcInput('3')" class="calc-btn">3</button>
        <button onclick="calcInput('-')" class="calc-op">−</button>
        <button onclick="calcInput('0')" class="calc-btn col-span-2">0</button>
        <button onclick="calcClear()" class="calc-op">C</button>
        <button onclick="calcInput('+')" class="calc-op">+</button>
        <button onclick="calcResult()" class="col-span-4 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold">=</button>
      </div>
    </div>
  </div>

  <!-- ================= TIENDA ================= -->
  <button onclick="openStore()" class="fixed bottom-24 right-6 z-[950] bg-amber-600 hover:bg-amber-500 w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg transition hover:scale-110" title="Tienda">🛒</button>

  <div id="storeModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[9998]">
    <div onclick="event.stopPropagation()" class="bg-zinc-900 border border-zinc-700 rounded-2xl p-6 w-[95vw] max-w-6xl max-h-[90vh] overflow-hidden shadow-2xl">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
        <div>
          <h2 class="text-2xl font-bold text-amber-400">🛒 Tienda</h2>
          <p class="text-sm text-zinc-400">Compra objetos para tu personaje usando Chikacoins.</p>
        </div>
        <div class="flex items-center gap-3">
          <select id="storePlayerSelect" class="px-3 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-white">
            <option value="">Selecciona tu personaje</option>
          </select>
          <button onclick="closeStore()" class="text-zinc-400 hover:text-white text-2xl">✕</button>
        </div>
      </div>

      <div id="storeWallet" class="hidden mb-5">
        <div class="bg-zinc-800 rounded-xl p-4 border border-zinc-700">
          <div class="text-xs text-zinc-400">Chikacoins disponibles</div>
          <div id="storeChikacoins" class="text-xl font-bold text-yellow-400">0</div>
        </div>
      </div>

      <div id="storeProducts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 max-h-[65vh] overflow-y-auto pr-1">
        <div class="col-span-full text-center text-zinc-400 py-10">Selecciona tu personaje para cargar la tienda.</div>
      </div>
    </div>
  </div>

  <button id="infoButton" onclick="openCampaignInfo()" class="fixed bottom-6 right-6 z-[950] bg-stone-700 hover:bg-stone-600 w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg transition hover:scale-110">ℹ</button>

  <!-- SCRIPT PRINCIPAL -->
  <script src="/js/player_view.js"></script>
  <!-- Tienda conectada al backend de Chikacoins -->
  <script src="/js/store.js"></script>

</body>

</html>
